pluginManagement {
	repositories {
		maven { url "https://maven.fabricmc.net/" }
		maven { url "https://maven.architectury.dev/" }
		maven { url "https://maven.minecraftforge.net/" }
		maven { url "https://maven.neoforged.net/releases/" }
		// Fallback for plugin markers when the Plugin Portal is flaky.
		mavenCentral()
		gradlePluginPortal()
	}
}

include("common")
include("fabric")
include("neoforge")

rootProject.name = "hexcessible"
