# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# gradle kotlin jvm plugin breaks without this
kotlin.stdlib.default.dependency=false

# needed for mixins to work for forge
asmVersion=9.4

# Minecraft / mappings. Yarn is kept deliberately: the whole codebase is written against Yarn
# names, and Architectury Loom remaps them to SRG/official for the NeoForge platform.
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.14
kotlin_version=1.8.0

# Mod Properties
mod_version=0.4.0
maven_group=dev.tizu.hexcessible
archives_base_name=hexcessible

# Multi-loader
# Architectury names the 1.20.1 NeoForge platform "forge" (see docs.architectury.dev/loom/using_neo)
enabledPlatforms=fabric,forge
architectury_version=9.2.14

# neoforge
# On 1.20.1 NeoForge publishes under net.neoforged:forge and keeps the net.minecraftforge.*
# packages and the "forge" mod id.
neoforge_version=1.20.1-47.1.106

# Dependencies -- shared
hexcasting_version=0.11.4
patchouli_version=85
clothconfig_version=11.1.136
hexdebug_version=0.9.0

# MixinExtras is bundled by Fabric Loader, but NeoForge 1.20.1 does not ship it, so the NeoForge
# jar embeds it via Jar-in-Jar (our mixins use @WrapMethod).
mixin_extras_version=0.4.1

# Dependencies -- fabric only
fabric_api_version=0.92.6+1.20.1
# Pinned to a Fabric Language Kotlin whose loader requirement the 0.16.14 loader satisfies. Newer
# releases require loader >=0.19.5, and Gradle then upgrades the loader on the dev classpath, whose
# bundled Mixin 0.8.7 conflicts with the Mixin 0.8.5 that Architectury Transformer 5.2.91 expects
# (startup dies with ClassNotFoundException: org.spongepowered.asm.service.IAdviceProvider).
fabric_kotlin_version=1.13.7+kotlin.2.2.21
modmenu_version=7.1.0
cardinal_components_version=5.2.1
