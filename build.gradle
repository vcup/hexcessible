plugins {
    id "architectury-plugin" version "3.4.+"
    id "dev.architectury.loom" version "1.9.+" apply false
}

architectury {
    minecraft = project.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        // Yarn is kept deliberately: every source file is written against Yarn names, and
        // Architectury Loom remaps them to SRG/official for the NeoForge platform.
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

        annotationProcessor "org.ow2.asm:asm:${project.asmVersion}"
        annotationProcessor "org.ow2.asm:asm-analysis:${project.asmVersion}"
        annotationProcessor "org.ow2.asm:asm-commons:${project.asmVersion}"
        annotationProcessor "org.ow2.asm:asm-tree:${project.asmVersion}"
        annotationProcessor "org.ow2.asm:asm-util:${project.asmVersion}"
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    version = project.mod_version
    group = project.maven_group

    repositories {
        mavenCentral()
        flatDir {
            name = "localModLibs"
            dir rootProject.file("libs")
        }
        // Ordering matters: Gradle aborts on a hard repository error (a TLS handshake failure is
        // one) instead of falling through to the next repo, so the hosts that actually hold most
        // artifacts are queried before the flakier general-purpose ones.
        maven { url "https://maven.blamejared.com" }
        maven { url "https://maven.shedaniel.me/" }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases/"
        }
        maven { url "https://maven.terraformersmc.com/releases/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.ladysnake.org/releases" }
        maven { url "https://jitpack.io" }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 17
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(Jar).configureEach {
        if (name == 'sourcesJar') {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }

    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }
}
